name: Weekly Database Backup & Archive

# Conformance:
# Phase 4 Plan 4.2 (Automated weekly database backup workflow)
# PRD FR-46 (Audit Trails & Data Integrity)
# Operational Reliability: Disaster Recovery & Automated Snapshots

on:
  schedule:
    # 00:00 UTC (05:30 IST) every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Retention period for backup artifacts in days (1-90)'
        required: false
        type: string
        default: '30'
      backup_type:
        description: 'Type of backup to perform'
        required: false
        type: choice
        default: 'full'
        options:
          - 'full'
          - 'schema_only'
          - 'data_only'
          - 'state'
      upload_artifact:
        description: 'Upload backup archive as GitHub Actions artifact'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  database-backup:
    name: Execute PostgreSQL pg_dump & State Archive
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Backup Directory
        run: |
          mkdir -p ../backups

      - name: Run Database Backup Script
        id: run_backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          BACKUP_TYPE="${{ github.event.inputs.backup_type || 'full' }}"
          echo "Executing automated backup with type: $BACKUP_TYPE..."
          python -m app.scripts.backup \
            --output-dir ../backups \
            --type "$BACKUP_TYPE" \
            --compress

      - name: Verify Backup Archive & Checksums
        id: verify_backup
        run: |
          echo "Verifying backup archives in ../backups..."
          for file in ../backups/*.gz; do
            if [ -f "$file" ]; then
              echo "Validating $file..."
              python -m app.scripts.backup --validate "$file"
            fi
          done
          echo "All backup archives passed gzip integrity and checksum verification."

      - name: Upload Backup Artifact
        if: ${{ github.event.inputs.upload_artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: mudra-backup-${{ github.run_number }}
          path: |
            backups/*.gz
            backups/*.sha256
            backups/*.json
          retention-days: ${{ fromJSON(github.event.inputs.retention_days || '30') }}
          if-no-files-found: error

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🗄️ Mudra Weekly Database Backup Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup Type:** ${{ github.event.inputs.backup_type || 'full' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention Policy:** ${{ github.event.inputs.retention_days || '30' }} days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Generated Backup Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          if [ -d "../backups" ]; then
            for f in ../backups/*.gz; do
              if [ -f "$f" ]; then
                fname=$(basename "$f")
                fsize=$(ls -lh "$f" | awk '{print $5}')
                csum=$(sha256sum "$f" | awk '{print $1}')
                echo "| \`$fname\` | $fsize | \`${csum:0:16}...\` |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

      - name: Open Alert Issue on Backup Failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueTitle = `🚨 [CRITICAL ALERT] Weekly Database Backup Failed (Run #${context.runNumber})`;
            const issueBody = `### Database Backup Pipeline Failure Alert\n\n` +
              `The automated weekly database backup failed on branch \`${context.ref}\`.\n\n` +
              `- **Run URL:** [View Action Run](${runUrl})\n` +
              `- **Trigger:** \`${context.eventName}\`\n` +
              `- **Commit:** \`${context.sha}\`\n` +
              `- **Timestamp:** ${new Date().toISOString()}\n\n` +
              `**Action Required:**\n` +
              `1. Review workflow logs for connection failures or pg_dump errors.\n` +
              `2. Verify DATABASE_URL / SUPABASE_DB_URL secret validity.\n` +
              `3. Trigger manual backup run via workflow_dispatch once resolved.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'critical', 'database', 'backup']
            });
