name: Mudra API Uptime & Health Monitor

# Conformance:
# Phase 4 Plan 4.3 (Health monitor and uptime check)
# PRD FR-48 (Status endpoint)
# SLA: Continuous Availability & Latency Monitoring

on:
  schedule:
    # Every 30 minutes, 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API URL to probe (leave empty to use API_BASE_URL secret or local probe)'
        required: false
        type: string
        default: ''
      max_latency_ms:
        description: 'Maximum allowable roundtrip latency in ms'
        required: false
        type: string
        default: '2000'

permissions:
  contents: read
  issues: write

jobs:
  uptime-check:
    name: Probe Health & Uptime Endpoints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Health & Availability Check
        id: run_probe
        env:
          CONFIGURED_URL: ${{ secrets.API_BASE_URL }}
          DISPATCH_URL: ${{ github.event.inputs.target_url }}
          MAX_LATENCY: ${{ github.event.inputs.max_latency_ms || '2000' }}
        run: |
          TARGET="${DISPATCH_URL:-$CONFIGURED_URL}"

          if [ -z "$TARGET" ]; then
            echo "No external target URL configured. Starting local Mudra test instance on port 8000..."
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
            UVICORN_PID=$!
            echo "Waiting for server to boot..."
            sleep 3
            TARGET="http://127.0.0.1:8000"
          fi

          echo "Target API Base URL: $TARGET"
          echo "Max Allowed Latency: ${MAX_LATENCY}ms"

          # Run healthcheck script and save JSON report
          python -m app.scripts.healthcheck \
            --url "$TARGET" \
            --max-latency-ms "$MAX_LATENCY" \
            --json > ../healthcheck_report.json

          # Print human-readable output
          python -m app.scripts.healthcheck \
            --url "$TARGET" \
            --max-latency-ms "$MAX_LATENCY"

          # Kill local uvicorn if started
          if [ -n "$UVICORN_PID" ]; then
            kill $UVICORN_PID || true
          fi

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🩺 Mudra API Uptime & Health Monitor Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "../healthcheck_report.json" ]; then
            echo "#### Probe Metrics" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          with open('../healthcheck_report.json') as f:
              data = json.load(f)
          print(f\"| **Overall Health** | {data.get('overall_status')} |\")
          print(f\"| **Target URL** | \`{data.get('target_url')}\` |\")
          print(f\"| **Liveness Latency** | {data.get('metrics', {}).get('health_latency_ms')} ms |\")
          print(f\"| **Status Latency** | {data.get('metrics', {}).get('status_latency_ms')} ms |\")
          print(f\"| **API Version** | {data.get('system', {}).get('version')} |\")
          print(f\"| **Prices As Of** | {data.get('system', {}).get('prices_as_of')} ({data.get('system', {}).get('market_state')}) |\")
          print(f\"| **Uptime** | {data.get('system', {}).get('uptime_seconds')} seconds |\")
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Open Alert Issue on Uptime Failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueTitle = `🚨 [CRITICAL ALERT] Mudra API Uptime Check Failed (Run #${context.runNumber})`;
            const issueBody = `### Production Uptime & Health Monitor Alert\n\n` +
              `The Mudra API health probe failed or breached latency SLA on branch \`${context.ref}\`.\n\n` +
              `- **Run URL:** [View Action Run](${runUrl})\n` +
              `- **Trigger:** \`${context.eventName}\`\n` +
              `- **Commit:** \`${context.sha}\`\n` +
              `- **Timestamp:** ${new Date().toISOString()}\n\n` +
              `**Action Required:**\n` +
              `1. Review workflow run logs to identify failing endpoints (/api/health or /api/status).\n` +
              `2. Verify whether API server is online or undergoing deployment.\n` +
              `3. Check latency SLA thresholds.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'critical', 'uptime']
            });
